# GPU control panel: arbitrates the single P100 between llama.cpp, Immich ML,
# Jellyfin and ComfyUI. It reaches every one of them over SSH to the host that
# owns it, so the SSH key is the mount that matters.
services:
  gpu-panel:
    build: .
    image: gpu-panel:local
    container_name: gpu-panel
    restart: unless-stopped
    # uvicorn is PID 1 and reaps nothing: `init` takes care of the ssh children.
    init: true
    ports:
      - "${PUBLISH_PORT:?}:8099"
    environment:
      - TZ=${TZ:-Etc/UTC}
      - PANEL_USER=${PANEL_USER:-admin}
      - PANEL_PASSWORD=${PANEL_PASSWORD:?PANEL_PASSWORD is required}
      - PANEL_TOKEN=${PANEL_TOKEN:?PANEL_TOKEN is required}
      # Values come from the rendered .env, never from this file.
      - LLAMA_PUBLIC_MODELS=${LLAMA_PUBLIC_MODELS:-}
      # Required: the panel's own localhost is not llama.cpp.
      - LLAMA_URL=${LLAMA_URL:?LLAMA_URL is required}
      - PVE_HOST=${PVE_HOST:?PVE_HOST is required}
      - IMMICH_HOST=${IMMICH_HOST:?IMMICH_HOST is required}
      - FRONTEND_HOST=${FRONTEND_HOST:?FRONTEND_HOST is required}
      # Jellyfin's config on that host, read over the same SSH.
      - JELLYFIN_XML=${JELLYFIN_XML:?JELLYFIN_XML is required}
      # The AI container, entered by its Proxmox VM ID, holds the unit's logs.
      - AI_CTID=${AI_CTID:?AI_CTID is required}
      - LLAMA_LOG_UNIT=${LLAMA_LOG_UNIT:-llama-server}
      - JELLYFIN_FALLBACK=${JELLYFIN_FALLBACK:-vaapi}
      # COMFY_URL is the LAN address: in its own container 127.0.0.1 is itself.
      - COMFY_URL=${COMFY_URL:-}
      - COMFY_UI_URL=${COMFY_UI_URL:-}
      - COMFY_CONTAINER=${COMFY_CONTAINER:-comfyui}
    volumes:
      # The key that reaches the PVE host and the other GPU consumers.
      - /root/.ssh:/root/.ssh:ro
      # Auto-switch settings survive a recreate.
      - gpu_panel_state:/state
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    # /api/session answers without credentials and never touches the PVE node,
    # which makes it the cheapest probe of the process itself.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/session', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  gpu_panel_state:
