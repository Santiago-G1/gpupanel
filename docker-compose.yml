# GPU control panel: arbitrates one card (or several) between llama.cpp and
# whatever else wants it. Everything it drives is reached over SSH, so the key
# is the mount that matters — the rest is settings.
services:
  gpu-panel:
    build: .
    image: gpu-panel:local
    container_name: gpu-panel
    restart: unless-stopped
    # uvicorn is PID 1 and reaps nothing: `init` takes care of the ssh children.
    init: true
    ports:
      - "${PUBLISH_PORT:?}:8099"
    environment:
      - TZ=${TZ:-Etc/UTC}
      # Required: where nvidia-smi answers, and the router that loads models.
      - GPU_HOST=${GPU_HOST:?GPU_HOST is required}
      - LLAMA_URL=${LLAMA_URL:?LLAMA_URL is required}
      # Only for a router that was started with `--api-key`.
      - LLAMA_API_KEY=${LLAMA_API_KEY:-}
      # Required: they sign the session cookie.
      - PANEL_USER=${PANEL_USER:-admin}
      - PANEL_PASSWORD=${PANEL_PASSWORD:?PANEL_PASSWORD is required}
      - PANEL_TOKEN=${PANEL_TOKEN:?PANEL_TOKEN is required}
      # llama.cpp and ComfyUI: the host they run on, and optionally the Proxmox
      # CT to enter there. Empty AI_CTID means they run on the host itself.
      - AI_HOST=${AI_HOST:-}
      - AI_CTID=${AI_CTID:-}
      - LLAMA_LOG_UNIT=${LLAMA_LOG_UNIT:-llama-server}
      # Optional display filter: only these model ids are ever named.
      - LLAMA_PUBLIC_MODELS=${LLAMA_PUBLIC_MODELS:-}
      # How many cards the node should have: 0 reports without judging.
      - GPU_EXPECTED=${GPU_EXPECTED:-0}
      # Consumers. Empty means "not configured": the panel says so and leaves
      # that part of the card alone.
      - IMMICH_HOST=${IMMICH_HOST:-}
      - IMMICH_ML_CONTAINER=${IMMICH_ML_CONTAINER:-}
      - IMMICH_PG_CONTAINER=${IMMICH_PG_CONTAINER:-}
      - IMMICH_REDIS_CONTAINER=${IMMICH_REDIS_CONTAINER:-}
      - IMMICH_QUEUE_PREFIX=${IMMICH_QUEUE_PREFIX:-}
      - IMMICH_ML_QUEUES=${IMMICH_ML_QUEUES:-}
      - JELLYFIN_HOST=${JELLYFIN_HOST:-}
      - JELLYFIN_XML=${JELLYFIN_XML:-}
      - JELLYFIN_CONTAINER=${JELLYFIN_CONTAINER:-}
      - JELLYFIN_FALLBACK=${JELLYFIN_FALLBACK:-vaapi}
      - COMFY_CONTAINER=${COMFY_CONTAINER:-}
      # COMFY_URL is the LAN address: in its own container 127.0.0.1 is itself.
      - COMFY_URL=${COMFY_URL:-}
      - COMFY_UI_URL=${COMFY_UI_URL:-}
    volumes:
      # The key that reaches the hosts this panel drives.
      - /root/.ssh:/root/.ssh:ro
      # Auto-switch settings survive a recreate.
      - gpu_panel_state:/state
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    # /api/session answers without credentials and never touches another host,
    # which makes it the cheapest probe of the process itself.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/session', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  gpu_panel_state:
